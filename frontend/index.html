<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>JobRadar AI | Find jobs. Verify jobs. Apply directly.</title>
    <meta name="description" content="AI-powered job discovery, verification, and direct-application platform with transparent authenticity scoring." />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('jobproof_display_preferences');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme === 'light' || parsed.theme === 'editorial') theme = 'light';
          } else {
            var legacy = localStorage.getItem('jobproof_theme');
            if (legacy === 'light' || legacy === 'editorial') theme = 'light';
          }
          var isLight = theme === 'light';
          var doc = document.documentElement;
          doc.classList.toggle('light', isLight);
          doc.classList.toggle('dark', !isLight);
          doc.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-canvas text-ink-primary font-sans antialiased min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
