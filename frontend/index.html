<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload Critical LCP Image for Fast Mobile & Desktop Discovery -->
    <link 
      rel="preload" 
      as="image" 
      type="image/webp" 
      href="/hero-character-400.webp" 
      imagesrcset="/hero-character-400.webp 400w, /hero-character-800.webp 800w, /hero-character.webp 500w" 
      imagesizes="(max-width: 640px) 260px, (max-width: 1024px) 340px, 420px" 
      fetchpriority="high"
    />

    <title>JobRadar AI | Find jobs. Verify jobs. Apply directly.</title>
    <meta name="description" content="AI-powered job discovery, verification, and direct-application platform with transparent authenticity scoring." />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <link rel="canonical" href="https://jobproof-frontend.vercel.app/" />
    <meta property="og:title" content="JobRadar AI | Find jobs. Verify jobs. Apply directly." />
    <meta property="og:description" content="AI-powered job discovery, verification, and direct-application platform with transparent authenticity scoring." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jobproof-frontend.vercel.app/" />
    <meta property="og:image" content="/hero-character-800.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JobRadar AI | Find jobs. Verify jobs. Apply directly." />
    <meta name="twitter:description" content="AI-powered job discovery, verification, and direct-application platform with transparent authenticity scoring." />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('jobproof_display_preferences');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed.theme === 'light' || parsed.theme === 'editorial') theme = 'light';
          } else {
            var legacy = localStorage.getItem('jobproof_theme');
            if (legacy === 'light' || legacy === 'editorial') theme = 'light';
          }
          var isLight = theme === 'light';
          var doc = document.documentElement;
          doc.classList.toggle('light', isLight);
          doc.classList.toggle('dark', !isLight);
          doc.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-canvas text-ink-primary font-sans antialiased min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
