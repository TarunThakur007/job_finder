server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: JobProof-Backend
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:jobproofdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

jobproof:
  verification:
    min-score-threshold: 80
  security:
    jwt-secret: ${JWT_SECRET:jobproof_default_development_secret_key_change_in_production_32bytes}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    model: gemini-1.5-flash
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent

